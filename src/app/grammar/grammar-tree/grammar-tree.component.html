<!--
  Say so when a filter matched more than we were willing to expand at once, rather than
  leaving a half-open tree looking arbitrary.
-->
<p class="expand-note" *ngIf="truncatedExpansion">
  Too many matches to expand at once — open a section to see the rest.
</p>

<mat-tree [dataSource]="dataSource" [treeControl]="treeControl" [trackBy]="trackNode" class="grammar-tree">

  <mat-tree-node *matTreeNodeDef="let node" class="leaf">
    <button type="button"
            class="row"
            [class.selected]="isSelected(node)"
            [class.unreferenced]="node.unreferenced"
            [title]="node.tooltip"
            (click)="select(node)"
            (contextmenu)="openMenu($event, node)">
      <mat-icon class="kind">{{ node.icon }}</mat-icon>
      <span class="label"><span *ngFor="let p of node.parts"
                                [class]="p.cls ? 'p-' + p.cls : ''">{{ p.text }}</span></span>
    </button>
  </mat-tree-node>

  <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
    <div class="branch">
      <button type="button" class="twisty" matTreeNodeToggle
              [attr.aria-label]="'toggle ' + node.label">
        <mat-icon>{{ treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right' }}</mat-icon>
      </button>
      <button type="button"
              class="row"
              [class.section]="node.level === 'section'"
              [class.group]="node.level === 'group'"
              [class.unreferenced]="node.unreferenced"
              [title]="node.tooltip"
              (click)="select(node)"
              (contextmenu)="openMenu($event, node)">
        <mat-icon class="kind">{{ node.icon }}</mat-icon>
        <span class="label">{{ node.label }}</span>
        <span class="badge" *ngIf="node.badge">{{ node.badge }}</span>
      </button>
    </div>

    <!--
      *ngIf, not a CSS class. Material's nested tree renders children into the outlet
      as soon as the parent renders and the usual examples merely hide them with CSS,
      which means opening a grammar instantiates every entry at once — ~1300 nodes for
      lfgxdrt_inference_grammar, enough to freeze the tab. Creating the outlet only
      while expanded keeps the rendered node count to what is actually on screen.
      CdkNestedTreeNode subscribes to its outlet QueryList, so children appear
      correctly when the outlet is created later.
    -->
    <div class="children" *ngIf="treeControl.isExpanded(node)" role="group">
      <ng-container matTreeNodeOutlet></ng-container>
    </div>
  </mat-nested-tree-node>

</mat-tree>
